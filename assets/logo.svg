<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -17 50 50" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">DySS Cockpit</title>
  <!-- The robot seen from above, heading down, its green light on the floor ahead: the same drawing
       as the application icon (src/Dyss.App/Rendering/RobotMarkers.cs, DrawIcon), in the robot's
       units (radius 16, front towards -y), turned half round. -->
  <defs>
    <linearGradient id="light" gradientUnits="userSpaceOnUse" x1="0" y1="-15" x2="0" y2="-33">
      <stop offset="0" stop-color="#4CE05A" stop-opacity="0.69"/>
      <stop offset="1" stop-color="#4CE05A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body">
      <circle r="16"/>
    </clipPath>
  </defs>
  <g transform="rotate(180)">
    <path d="M-6,-14 L-13,-31 Q0,-35 13,-31 L6,-14 Z" fill="url(#light)"/>
    <g stroke-width="1.8" stroke-linecap="round">
      <path stroke="#378ADD" d="M-11,-11 v-8 M-11,-11 l6.928,4 M-11,-11 l-6.928,4"/>
      <path stroke="#E24B4A" d="M11,-11 v-8 M11,-11 l6.928,4 M11,-11 l-6.928,4"/>
    </g>
    <circle r="16" fill="#2C2C2A" stroke="#888780" stroke-width="1.2"/>
    <rect x="-9" y="8.5" width="18" height="16" rx="2.5" fill="#7F77DD" clip-path="url(#body)"/>
    <rect x="-9" y="-3" width="18" height="7" rx="1.5" fill="#444441"/>
    <circle cy="-7.5" r="1.6" fill="#B4B2A9"/>
  </g>
</svg>
