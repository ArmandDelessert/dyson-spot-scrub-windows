# Dependabot proposes updates as pull requests, once a week; nothing is merged without a review.
# Each pull request runs the CI, which builds and tests the application with the new versions.
version: 2
updates:
  # NuGet packages. Their versions all live in Directory.Packages.props.
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
      day: monday
    groups:
      # The Windows App SDK components go together: the Runtime package checks at build time that the
      # versions agree, so they must not be updated one by one.
      windows-app-sdk:
        patterns:
          - Microsoft.WindowsAppSDK.*
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
      tests:
        patterns:
          - xunit*
          - Microsoft.Testing.*

  # The actions used by the workflows (checkout, setup-dotnet, upload-artifact...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
