name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # WinUI only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Dyss.slnx

      - name: Build
        run: dotnet build Dyss.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Dyss.slnx --configuration Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
