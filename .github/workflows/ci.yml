name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # WPF only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MyDyson.slnx

      - name: Build
        run: dotnet build MyDyson.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/MyDyson.Core.Tests --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/results.trx"
