name: CI

# Every pushed branch is built and tested, not only main: work is pushed on branches and merged
# locally, without pull requests.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    # WinUI only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DyssCockpit.slnx

      - name: Build
        run: dotnet build DyssCockpit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution DyssCockpit.slnx --configuration Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
