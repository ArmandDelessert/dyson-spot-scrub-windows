name: Release

# Builds the application for x64 and ARM64, each a self-contained folder (it carries .NET and the
# Windows App SDK, nothing to install) in a zip with its SHA-256 checksum, in three ways:
#  - pushing a tag v1.2.3 publishes that version as a GitHub release; a suffix (v1.2.3-beta.1) makes it a pre-release;
#  - every push to main replaces the "dev" pre-release with a build of that commit (version 0.0.0-dev.N), so
#    there is always a download that matches main. It leaves "latest release" to the last tagged version;
#  - "Run workflow", on any branch, builds the same zips and keeps them as a workflow artifact only: a way to
#    check this file, or to try a branch, without publishing anything.
on:
  push:
    tags: ['v*']
    branches: [main]
    # Branch pushes only (tags ignore path filters): a change that leaves the application as it was is no new build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/dependabot.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: write   # to create the release

# A newer push to main replaces a build still running; a tag, or a manual run, is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  release:
    # WinUI only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $m = [regex]::Match($env:REF_NAME, '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$')
            if (-not $m.Success) { throw "Tag '$($env:REF_NAME)': expected vX.Y.Z or vX.Y.Z-suffix." }
            $version = $env:REF_NAME.Substring(1)
            $prerelease = $m.Groups[2].Success
          } else {
            $version = "0.0.0-dev.$($env:RUN_NUMBER)"
            $prerelease = $true
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --solution DyssCockpit.slnx --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            # A folder carrying .NET and the Windows App SDK: WinUI does not run from a single file.
            dotnet publish src/DyssCockpit.App/DyssCockpit.App.csproj --configuration Release --runtime $rid --self-contained `
              -p:DebugType=none -p:Version=$version --output "publish/$rid"
            if ($LASTEXITCODE -ne 0) { throw "Publishing $rid failed." }
            Copy-Item README.md, LICENSE "publish/$rid"
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "dist/DyssCockpit-$version-$rid.zip"
          }
          # Checksums, so a download can be checked against what was built here.
          Get-ChildItem dist/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii

      # The MSIX package, built for x64 and ARM64 and bundled (tools/msix/build-msix.ps1). Windows installs it only when it is signed,
      # so it joins the release only with a certificate: the repository's secrets MSIX_CERTIFICATE (the .pfx, in base64) and
      # MSIX_PASSWORD, and its variable MSIX_PUBLISHER (the certificate's subject, "CN=..."). Without them the build still runs, to
      # check it, and a manual run keeps the unsigned bundle (for tools/msix/New-TestCertificate.ps1).
      - name: Package (MSIX)
        id: msix
        shell: pwsh
        env:
          MSIX_CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
          MSIX_PASSWORD: ${{ secrets.MSIX_PASSWORD }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          $parameters = @{ Version = '${{ steps.version.outputs.version }}'; OutputFolder = 'msix' }
          if ($env:MSIX_PUBLISHER) { $parameters.Publisher = $env:MSIX_PUBLISHER }
          $signed = [bool] $env:MSIX_CERTIFICATE
          if ($signed) {
            $pfx = Join-Path $env:RUNNER_TEMP 'msix-certificate.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERTIFICATE))
            $parameters.CertificatePath = $pfx
            $parameters.CertificatePassword = $env:MSIX_PASSWORD
          }
          ./tools/msix/build-msix.ps1 @parameters
          if ($signed) {
            Copy-Item msix/*.msixbundle dist
            Get-ChildItem dist/* -Exclude SHA256SUMS.txt | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
              Set-Content dist/SHA256SUMS.txt -Encoding ascii
          }
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Keep the unsigned MSIX bundle (manual run)
        if: github.event_name == 'workflow_dispatch' && steps.msix.outputs.signed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: msix-unsigned
          path: msix/*.msixbundle
          retention-days: 7

      - name: Keep the build (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 7

      - name: Release (tag)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--generate-notes', '--title', 'Version ${{ steps.version.outputs.version }}')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist/*).FullName @flags

      - name: Release (dev build of main)
        if: github.event_name == 'push' && github.ref_type == 'branch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $subject = git log -1 --format=%s
          @"
          Built automatically from the latest commit of ``main`` ($short): “$subject”.

          It replaces the previous one at every change and may be unstable. The stable version is the latest numbered release.
          "@ | Set-Content notes.md -Encoding utf8
          # The previous dev build goes, with its tag: the new release makes the tag again, on this commit.
          $existing = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($existing -contains 'dev') {
            gh release delete dev --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not delete the previous development build." }
          }
          gh release create dev (Get-ChildItem dist/*).FullName --target $env:GITHUB_SHA --prerelease `
            --title "Development build ($short)" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { throw "Could not create the development build." }
